apiVersion: v1
kind: Service
metadata:
  name: baladengale-site
  namespace: baladengale
  labels:
    app.kubernetes.io/name: baladengale-site
    app.kubernetes.io/part-of: baladengale-site
  annotations:
    # kind-infra registration for `make sync` in the kind repo — converges on
    # the same HTTPRoute as deploy/route.yaml (applied by `make site-deploy`)
    kind-infra.dev/host: "baladengale"
    kind-infra.dev/port: "8080"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: baladengale-site
  ports:
    - name: http
      port: 8080
      targetPort: http
