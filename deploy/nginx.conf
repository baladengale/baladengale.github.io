server {
    listen 8080;
    server_name baladengale.internal _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # pretty URLs for blog posts: /blog/<slug> -> /blog/<slug>/index.html
    location /blog/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # long-cache fingerprinted assets
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
