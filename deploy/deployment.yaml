apiVersion: apps/v1
kind: Deployment
metadata:
  name: baladengale-site
  namespace: baladengale
  labels:
    app.kubernetes.io/name: baladengale-site
    app.kubernetes.io/part-of: baladengale-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: baladengale-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baladengale-site
        app.kubernetes.io/part-of: baladengale-site
    spec:
      containers:
        - name: web
          image: baladengale-site:latest
          imagePullPolicy: IfNotPresent   # image is side-loaded into kind
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
